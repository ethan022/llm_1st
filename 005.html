<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
    <ul>
    <li><a href="#card-note">노트</a></li>
    <li><a href="#card-pen">펜</a></li>
    <li><a href="#card-pencil">연필</a></li>
    </ul>
</nav>
    <h3 id="card-note">노트</h3>
    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://placehold.co/300x200?text=NOTE" alt="노트 제품 사진" width="300" height="200">
    </a>
    <p>고품질 종이로 제작된 노트입니다.</p>

    <h3 id="card-pen">펜</h3>
    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">

    </a>
    <p>글을 쓰는 데 적합한 펜입니다.</p>

    <h3 id="card-pencil">연필</h3>
    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://placehold.co/300x200?text=PENCIL" alt="연필 제품 사진" width="300" height="200">
    </a>
    <p>고품질 나무로 제작된 연필입니다.</p> 

    <h3 id="card-eraser">지우개</h3>
    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
        <img src="https://placehold.co/300x200?text=ERASER" alt="지우개 제품 사진" width="300" height="200">
    </a>
    <p>깨끗하게 지워지는 지우개입니다.</p>
    
</body>
</html>
